apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-cd-final-project-pipeline
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/Avdoot-pune/ci-cd-final-project

    - name: revision
      type: string
      default: main

    - name: image-url
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-avdootpuneka/ci-cd-final-project:latest

    - name: app-name
      type: string
      default: ci-cd-final-project

    - name: build-image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-avdootpuneka/ci-cd-final-project:latest

  workspaces:
    - name: output

  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: output

    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: output

    - name: eslint
      runAfter:
        - git-clone
      taskRef:
        name: eslint
      params:
        - name: args
          value: "src/ tests/ --ext *.js"
      workspaces:
        - name: source
          workspace: output

    - name: jest-test
      runAfter:
        - eslint
      taskRef:
        name: jest-test
      params:
        - name: args
          value: "-- --runInBand"
      workspaces:
        - name: source
          workspace: output

    - name: buildah
      runAfter:
        - jest-test
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: $(params.image-url)
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: output

    - name: deploy
      runAfter:
        - buildah
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
        - name: SCRIPT
          value: >-
            oc create deployment $(params.app-name)
            --image=$(params.build-image)
            --dry-run=client -o yaml | oc apply -f -
